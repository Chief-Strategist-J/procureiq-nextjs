version: '1.0'
name: procureiq-nextjs
exposes:
  - name: auth
    path: ./Auth
    description: Authentication module
  - name: notifications
    path: ./Notifications
    description: Notifications module
  - name: fieldservice
    path: ./FieldService
    description: Field service module
  - name: crypto
    path: ./Crypto
    description: Crypto module
  - name: campaigns
    path: ./Campaigns
    description: Campaigns module
  - name: jobs
    path: ./Jobs
    description: Jobs module
  - name: email
    path: ./Email
    description: Email module
  - name: github
    path: ./Github
    description: Github module
events:
  emits:
    - user.logged-in
    - notification.received
    - cart.updated
  listens:
    - user.logged-in
    - notification.received
    - cart.updated
