SPECIFICATION Spec

CONSTANTS
    Users = {user1, user2}
    Credentials = {cred1, cred2}
    AccessTokens = {at1, at2}
    RefreshTokens = {rt1, rt2}
    Sessions = {sess1, sess2}
    Roles = {"admin", "manager", "user"}
    Permissions = {"read", "write", "delete"}
    MaxRetries = 3
    MaxSessionsPerUser = 2
    TokenTTL = 5

INVARIANTS
    TypeInvariant
    AuthSafetyInvariant
    AuthenticatedImpliesValidTokenAndUser
    LoggedOutUsersHaveNoValidToken
    RevokedTokensNeverAuthenticate
    RetryCountBounded
    TokenRotationInvalidatesPreviousToken
    SessionAlwaysHasOwner
