spring.application.name=springboot-app
server.port=6565

# Database Configuration (AlloyDB Omni / PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procureiq}?stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hikari Connection Pool Settings
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=ProcureIQHikariCP
# Reduced pool size for Render free tier (512MB RAM limit)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED



# JWT Security Configuration
jwt.secret=${JWT_SECRET:procureiq-secret-key-12345}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Binance API External Configurations
binance.api.key=${BINANCE_API_KEY:}
binance.api.secret=${BINANCE_API_SECRET:}
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}

# Lazy init — load beans only on first request, not at startup
spring.main.lazy-initialization=true
# Suppress Spring banner (minor but clean)
spring.main.banner-mode=off
# Disable JMX to reduce startup bean registration overhead
spring.jmx.enabled=false
# Faster pool connection validation query
spring.datasource.hikari.connection-test-query=SELECT 1
# Exclude unused auto-configurations to reduce startup scan overhead
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration

# Spring Mail Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
