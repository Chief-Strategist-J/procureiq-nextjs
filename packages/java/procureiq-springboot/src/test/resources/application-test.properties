# H2 In-Memory Database for Unit Testing
spring.datasource.url=jdbc:h2:mem:procureiq_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable automatic DDL generation for PostgreSQL-specific data types (inet, jsonb, etc)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Disable Lazy Init for Test Context execution
spring.main.lazy-initialization=false
