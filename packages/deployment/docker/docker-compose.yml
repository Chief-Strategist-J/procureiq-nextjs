services:
  alloydb-omni:
    image: google/alloydbomni:15
    container_name: procureiq-alloydb-local
    ports:
      - "${ALLOYDB_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-procureiq}
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    restart: always

  kafka:
    image: apache/kafka:latest
    container_name: procureiq-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    restart: always

  tempo:
    image: grafana/tempo:latest
    container_name: procureiq-tempo
    command: [ "-config.file=${TEMPO_CONFIG_FILE:-/etc/tempo.yaml}" ]
    volumes:
      - ${TEMPO_YAML_PATH:-./tempo.yaml}:/etc/tempo.yaml
    ports:
      - "${TEMPO_QUERY_PORT:-3200}:3200"
      - "${TEMPO_GRPC_PORT:-4317}:4317"
      - "${TEMPO_HTTP_PORT:-4318}:4318"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: procureiq-grafana
    volumes:
      - ${GRAFANA_DATASOURCE_PATH:-./grafana-datasource.yaml}:/etc/grafana/provisioning/datasources/tempo.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
    ports:
      - "${GRAFANA_PORT:-3001}:${GRAFANA_INTERNAL_PORT:-3000}"
    depends_on:
      - tempo
    restart: always

  springboot-app:
    build:
      context: ${SPRINGBOOT_CONTEXT:-../../java/procureiq-springboot}
      dockerfile: ${SPRINGBOOT_DOCKERFILE:-../../deployment/docker/Dockerfile.springboot}
    container_name: procureiq-springboot-app
    ports:
      - "${SPRINGBOOT_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRINGBOOT_DATASOURCE_URL:-jdbc:postgresql://alloydb-omni:5432/procureiq}
      - SPRING_DATASOURCE_USERNAME=${SPRINGBOOT_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRINGBOOT_DATASOURCE_PASSWORD:-postgres}
      - OTEL_SERVICE_NAME=${SPRINGBOOT_OTEL_SERVICE_NAME:-springboot-app}
      - OTEL_TRACES_EXPORTER=${SPRINGBOOT_OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${SPRINGBOOT_OTEL_EXPORTER_ENDPOINT:-http://tempo:4317}
      - OTEL_METRICS_EXPORTER=${SPRINGBOOT_OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${SPRINGBOOT_OTEL_LOGS_EXPORTER:-none}
    depends_on:
      - alloydb-omni
      - tempo
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.springboot.rule=PathPrefix(`/api`)"
      - "traefik.http.services.springboot.loadbalancer.server.port=8080"

  nextjs-app:
    build:
      context: ${NEXTJS_CONTEXT:-../../node/procureiq-nextjs}
      dockerfile: ${NEXTJS_DOCKERFILE:-../../deployment/docker/Dockerfile.nextjs}
    container_name: procureiq-nextjs-app
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXTJS_API_URL:-http://springboot-app:8080/api/v1}
      - DATABASE_URL=${NEXTJS_DATABASE_URL:-postgresql://postgres:postgres@alloydb-omni:5432/procureiq}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${NEXTJS_OTEL_ENDPOINT:-http://tempo:4318/v1/traces}
    depends_on:
      - alloydb-omni
      - tempo
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs.rule=PathPrefix(`/`)"
      - "traefik.http.services.nextjs.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v2.10
    container_name: procureiq-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_WEB_PORT:-80}"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG_PATH:-../traefik}:/etc/traefik
    restart: always

  redis:
    image: redis:latest
    container_name: procureiq-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  alloydb_data:
    driver: local
  redis_data:
    driver: local
