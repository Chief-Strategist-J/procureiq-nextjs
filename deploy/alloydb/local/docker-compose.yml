version: '3.8'

services:
  alloydb-omni:
    image: postgres:15-alpine
    container_name: procureiq-alloydb-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - POSTGRES_USER=${ALLOYDB_USER:-postgres}
      - POSTGRES_DB=${ALLOYDB_DB:-procureiq}
    volumes:
      - alloydb_data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:latest
    container_name: procureiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  kafka:
    image: apache/kafka:latest
    container_name: procureiq-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    restart: always

  python-ai:
    build:
      context: ../../../packages/python/procureiq-python
      dockerfile: Dockerfile
    container_name: procureiq-python-ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@procureiq-alloydb-local:5432/procureiq
      - KAFKA_BOOTSTRAP_SERVERS=procureiq-kafka:9092
      - SPRINGBOOT_API_URL=http://procureiq-springboot:6565
    depends_on:
      - alloydb-omni
      - kafka

  springboot-app:
    build:
      context: ../../../packages/java/procureiq-springboot
      dockerfile: Dockerfile
    container_name: procureiq-springboot
    ports:
      - "6565:6565"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://procureiq-alloydb-local:5432/procureiq
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=procureiq-kafka:9092
    depends_on:
      - alloydb-omni
      - redis
      - kafka

  nextjs-frontend:
    build:
      context: ../../../packages/node/procureiq-nextjs
      dockerfile: Dockerfile
    container_name: procureiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:6565
      - NEXT_PUBLIC_PYTHON_API_URL=http://localhost:8000
    depends_on:
      - springboot-app
      - python-ai

volumes:
  alloydb_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
